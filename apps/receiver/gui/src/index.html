<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Network - Receiver</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="topbar">
        <h1>Receiver</h1>
        <span id="status-badge" class="badge badge-idle">Idle</span>
      </header>

      <p id="status-line" class="status-line"></p>

      <div class="field">
        <label for="volume-slider">Volume <span id="volume-value" class="mono">1.00</span></label>
        <input id="volume-slider" type="range" min="0" max="2" step="0.01" value="1" />
      </div>

      <div class="field-inline">
        <label class="checkbox">
          <input id="mute-toggle" type="checkbox" />
          Mute
        </label>
      </div>

      <div class="actions">
        <button id="start-btn" type="button" class="primary">Start</button>
        <button id="stop-btn" type="button" class="danger" disabled>Stop</button>
        <button id="settings-toggle" type="button" class="secondary icon-btn" title="Settings" aria-expanded="false">⚙</button>
      </div>

      <p id="error-msg" class="error"></p>

      <section id="settings-panel" class="card settings-panel" hidden>
        <div class="field-row">
          <div class="field">
            <label for="listen-input">Listen address</label>
            <input id="listen-input" type="text" value="0.0.0.0:9000" />
          </div>
          <div class="field">
            <label for="jitter-input">Jitter buffer (ms)</label>
            <input id="jitter-input" type="number" min="1" value="40" />
          </div>
        </div>

        <p class="hint">This device is remembered and used automatically next time the app starts.</p>
      </section>
    </main>
  </body>
</html>
