<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Network - Receiver</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="topbar">
        <h1>Receiver</h1>
        <span id="status-badge" class="badge badge-idle">Idle</span>
      </header>

      <section class="card">
        <div class="field-row">
          <div class="field">
            <label for="listen-input">Listen address</label>
            <input id="listen-input" type="text" value="0.0.0.0:9000" />
          </div>
          <div class="field">
            <label for="jitter-input">Jitter buffer (ms)</label>
            <input id="jitter-input" type="number" min="1" value="40" />
          </div>
        </div>

        <div class="field">
          <label for="volume-slider">Master volume <span id="volume-value" class="mono">1.00</span></label>
          <input id="volume-slider" type="range" min="0" max="2" step="0.01" value="1" />
        </div>

        <div class="field field-inline">
          <label class="checkbox">
            <input id="mute-toggle" type="checkbox" />
            Mute
          </label>
        </div>

        <div class="actions">
          <button id="start-btn" type="button" class="primary">Start listening</button>
          <button id="stop-btn" type="button" class="danger" disabled>Stop</button>
        </div>

        <p id="error-msg" class="error"></p>
      </section>

      <section class="card stats">
        <h2>Stream</h2>
        <dl class="stat-grid">
          <dt>From</dt>
          <dd id="stat-from">-</dd>
          <dt>Format</dt>
          <dd id="stat-format">-</dd>
          <dt>Received</dt>
          <dd id="stat-received" class="mono">0</dd>
          <dt>Late / dropped</dt>
          <dd id="stat-late" class="mono">0</dd>
          <dt>Duplicates dropped</dt>
          <dd id="stat-dup" class="mono">0</dd>
          <dt>Underruns</dt>
          <dd id="stat-underruns" class="mono">0</dd>
        </dl>
      </section>
    </main>
  </body>
</html>
