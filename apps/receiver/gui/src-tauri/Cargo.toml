[package]
name = "receiver-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri GUI for the audio-network receiver"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib
# name unique so it wouldn't conflict with the bin name (Windows-only issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "receiver_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
protocol = { workspace = true }
network = { workspace = true }
audio-core-mixer = { workspace = true }
